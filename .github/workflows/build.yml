name: Build Phiếu Lương

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact: |
              phieu-luong-app/release/*.dmg
              phieu-luong-app/release/*.dmg.blockmap
              phieu-luong-app/release/latest-mac.yml
          - os: windows-latest
            target: win
            artifact: |
              phieu-luong-app/release/*.exe
              phieu-luong-app/release/*.exe.blockmap
              phieu-luong-app/release/latest.yml

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: phieu-luong-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phieu-luong-app/package-lock.json

      - name: Install qpdf (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install qpdf

      - name: Install qpdf (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install qpdf -y

      - name: Install deps
        run: npm ci

      # `--publish never` keeps electron-builder from auto-uploading during
      # build (which previously failed with "GH_TOKEN not set"). The dedicated
      # `release` job below handles publishing after both targets build.
      - name: Build
        run: |
          npm run build:renderer
          npm run build:electron
          npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phieu-luong-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
